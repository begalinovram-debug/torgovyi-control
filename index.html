<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#047857" />
    <meta name="background-color" content="#f1f5f9" />

    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="Торговый Контроль"
    />

    <meta
      name="description"
      content="Торговый Контроль — управление товарами, продажами, клиентами и торговыми представителями."
    />

    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <title>Торговый Контроль</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

    <script>
      if (
        "serviceWorker" in navigator &&
        location.hostname !== "localhost" &&
        location.hostname !== "127.0.0.1"
      ) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("/sw.js")
            .catch(function (error) {
              console.warn("PWA:", error);
            });
        });
      }
    </script>
  </body>
</html>
